[project]
name = "agentgate-backend"
version = "0.1.0"
description = "AgentGate support-agent authorization demo — foundation API"
requires-python = ">=3.12"
dependencies = [
    "cedarpy==4.12.0",
    "fastapi>=0.115,<1",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.6,<3",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.3,<10",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
