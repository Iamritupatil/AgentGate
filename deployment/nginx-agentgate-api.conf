# API-only vhost for the split deployment: the control room is served by
# Vercel, this box serves nothing but the gate.
#
# No CORS headers are set here. When the browser reaches the API through the
# Vercel rewrite the hop is server-side and CORS never applies; when it calls
# this host directly, FastAPI's CORSMiddleware owns those headers, and a second
# copy added by nginx makes the browser reject the response outright.

upstream agentgate_api {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    # enable-tls.sh replaces this with your domain before requesting a
    # certificate, because certbot matches a vhost by server_name.
    server_name _;

    server_tokens off;
    client_max_body_size 1m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    # Policy Studio's AI draft calls an upstream model and is the slowest route
    # here; the browser gives up at 10s, so this only has to outlast that.
    proxy_read_timeout 30s;
    proxy_connect_timeout 5s;

    location /api/ {
        proxy_pass http://agentgate_api/api/;
    }

    # Infrastructure liveness, separate from the browser-facing /api/health.
    location = /health {
        access_log off;
        proxy_pass http://agentgate_api/health;
    }

    location = /docs {
        proxy_pass http://agentgate_api/docs;
    }

    location = /openapi.json {
        proxy_pass http://agentgate_api/openapi.json;
    }

    # This host has no frontend to serve. Saying so is better than a default
    # nginx page that looks like a half-finished deployment.
    location / {
        default_type text/plain;
        return 404 "AgentGate API. The control room is deployed separately.\n";
    }
}
